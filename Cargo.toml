[package]
name = "rm-weread"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
# Same choice as rm-agent: ureq is a genuinely synchronous HTTP client
# with no background async runtime, which matters on-device where a
# stray tokio runtime has previously broken raw std::thread evdev
# readers (see rm-agent's Cargo.toml comment / conversation history).
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md-5 = "0.10"
sha2 = "0.10"
base64 = "0.22"
urlencoding = "2"
