[package]
name = "rm-weread"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
# Same choice as rm-agent: ureq is a genuinely synchronous HTTP client
# with no background async runtime, which matters on-device where a
# stray tokio runtime has previously broken raw std::thread evdev
# readers (see rm-agent's Cargo.toml comment / conversation history).
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md-5 = "0.10"
sha2 = "0.10"  # not used yet — reserved for the /web/book/read `sg` signature (phase 3+)
urlencoding = "2"
# PDF pipeline (docs/design.md §"PDF 生成流水线"): ttf-parser reads the
# embedded CJK font's cmap/hmtx for glyph ids and widths; flate2 (pure
# -Rust miniz_oxide backend, no C toolchain needed for the musl targets)
# compresses PDF content streams and the embedded font file.
ttf-parser = "0.25"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

# The daemon is a release download now, and it carries a 7MB embedded
# font, so size is worth a little link time.
[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
